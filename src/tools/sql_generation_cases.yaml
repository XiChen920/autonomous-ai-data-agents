# Starter SQL-generation benchmark cases.
# These cases check whether generated SQL executes and returns the expected
# result shape. This is a seed benchmark, not a large-scale LLM accuracy study.
cases:
  - id: chinook_sales_by_country
    database: chinook
    question: Show total sales by country
    expected_columns:
      - country
      - total_sales
    min_rows: 1
    expected_sql_contains:
      - invoices
      - BillingCountry
      - SUM
    golden_sql: |
      SELECT BillingCountry AS country, ROUND(SUM(Total), 2) AS total_sales
      FROM invoices
      GROUP BY BillingCountry
      ORDER BY total_sales DESC
    numeric_tolerance: 0.01

  - id: chinook_monthly_sales_trend
    database: chinook
    question: Show monthly sales trend
    expected_columns:
      - month
      - total_sales
    min_rows: 1
    expected_sql_contains:
      - invoices
      - InvoiceDate
      - SUM
    golden_sql: |
      SELECT strftime('%Y-%m', InvoiceDate) AS month, ROUND(SUM(Total), 2) AS total_sales
      FROM invoices
      GROUP BY month
      ORDER BY month
    numeric_tolerance: 0.01

  - id: northwind_revenue_by_category
    database: northwind
    question: Show revenue by category
    expected_columns:
      - category
      - revenue
    min_rows: 1
    expected_sql_contains:
      - OrderDetail
      - Category
      - SUM
    golden_sql: |
      SELECT Category.CategoryName AS category,
             ROUND(SUM(OrderDetail.UnitPrice * OrderDetail.Quantity * (1 - OrderDetail.Discount)), 2) AS revenue
      FROM OrderDetail
      JOIN Product ON Product.Id = OrderDetail.ProductId
      JOIN Category ON Category.Id = Product.CategoryId
      GROUP BY Category.CategoryName
      ORDER BY revenue DESC
    numeric_tolerance: 0.01

  - id: sakila_revenue_by_category
    database: sakila
    question: Show revenue by category
    expected_columns:
      - category
      - revenue
    min_rows: 1
    expected_sql_contains:
      - payment
      - category
      - SUM
    golden_sql: |
      SELECT category.name AS category, ROUND(SUM(payment.amount), 2) AS revenue
      FROM payment
      JOIN rental ON rental.rental_id = payment.rental_id
      JOIN inventory ON inventory.inventory_id = rental.inventory_id
      JOIN film_category ON film_category.film_id = inventory.film_id
      JOIN category ON category.category_id = film_category.category_id
      GROUP BY category.name
      ORDER BY revenue DESC
    numeric_tolerance: 0.01

  - id: chinook_average_invoice_by_country
    database: chinook
    question: Which countries have the highest average invoice value?
    expected_columns:
      - country
      - average_invoice_value
    min_rows: 1
    expected_sql_contains:
      - invoices
      - AVG
    golden_sql: |
      SELECT BillingCountry AS country, ROUND(AVG(Total), 2) AS average_invoice_value
      FROM invoices
      WHERE BillingCountry IS NOT NULL
      GROUP BY BillingCountry
      ORDER BY average_invoice_value DESC
    numeric_tolerance: 0.01
    online_only: true
